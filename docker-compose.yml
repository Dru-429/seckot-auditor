version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: secko-auditor-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DB: secko-auditor
    volumes:
      - mongodb_data:/data/db
    networks:
      - secko-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secko-auditor-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/secko-auditor?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRE: 7d
      PORT: 5000
      NODE_ENV: development
      ARMORIQ_API_KEY: your_armoriq_api_key_here
      ARMORIQ_API_URL: https://api.armoriq.com/v1
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - secko-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secko-auditor-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - secko-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  secko-network:
    driver: bridge
